<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Das Rätsel des Königs</title>
<style>
* { box-sizing: border-box; }
html, body { margin:0; padding:0; width:100%; min-height:100%; overflow-x:hidden; }
body {
  zoom:0.72;
  width:138.8889%;
  background: transparent;
  color:#17130f;
  font-family: Georgia, "Times New Roman", serif;
}
.panel {
  width:100%;
  max-width:860px;
  margin:0 auto;
  padding:clamp(14px, 3vw, 28px);
  background:
    radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.34), transparent 48%),
    repeating-linear-gradient(0deg, rgba(111,75,35,.025) 0px, rgba(111,75,35,.025) 1px, transparent 1px, transparent 5px),
    linear-gradient(135deg,#f4e4c5 0%,#e8d2aa 52%,#f1dfbd 100%);
  border:2px solid #b18a55;
  box-shadow: inset 0 0 18px rgba(105,68,29,.12);
}
h1 {
  margin:0 0 8px;
  font-size:clamp(21px,4vw,29px);
  line-height:1.2;
  font-weight:normal;
}
.instruction {
  margin:0 0 12px;
  font-size:clamp(15px,2.6vw,19px);
  line-height:1.28;
}
.graph {
  display:block;
  width:min(100%, 355px);
  height:auto;
  margin:0 auto 12px;
  object-fit:contain;
}
table {
  border-collapse:collapse;
  margin:0 auto;
  background:rgba(255,250,240,.78);
  font-size:clamp(17px,3vw,22px);
  color:#17130f;
}
th, td {
  border:2px solid #4c4338;
  width:82px;
  height:39px;
  padding:2px 5px;
  text-align:center;
}
th { font-weight:normal; background:rgba(217,196,160,.7); }
td input {
  display:block;
  width:100%;
  height:34px;
  border:0;
  outline:none;
  background:rgba(255,255,255,.72);
  text-align:center;
  color:#17130f;
  font:inherit;
  padding:0 3px;
  border-radius:0;
}
td input:focus { box-shadow:inset 0 0 0 2px #b58a3d; }
td input:disabled {
  background:rgba(213,225,198,.9);
  color:#294323;
  font-weight:bold;
}
.controls {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  margin-top:16px;
}
#checkButton {
  border:2px solid #745022;
  border-radius:7px;
  padding:10px 25px;
  background:linear-gradient(#d5ad68,#a87936);
  color:#fff;
  font: bold 17px Georgia,serif;
  cursor:pointer;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
}
#checkButton:hover { filter:brightness(1.08); }
#feedback {
  min-height:25px;
  text-align:center;
  font:bold 17px Georgia,serif;
}
.error { color:#9d2018; }
.success { color:#31552b; }
.arrow-wrap {
  #resultCode {
  display: none;
  width: 90px;
  height: 58px;
  margin: 2px auto 0;
  align-items: center;
  justify-content: center;
  border: 2px solid #76521d;
  border-radius: 9px;
  background: linear-gradient(#e5c46d,#ae812b);
  color: white;
  font: bold 32px Georgia,serif;
  letter-spacing: 5px;
  box-shadow: 0 3px 7px rgba(0,0,0,.25);
}
}
#nextButton {
  display:flex;
  width:76px;
  height:58px;
  align-items:center;
  justify-content:center;
  border:2px solid #76521d;
  border-radius:9px;
  background:linear-gradient(#e5c46d,#ae812b);
  color:white;
  text-decoration:none;
  font: bold 38px Georgia,serif;
  box-shadow:0 3px 7px rgba(0,0,0,.25);
}
#cover {
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #6f4924;
  border-radius:9px;
  background:
    radial-gradient(circle at 50% 45%, #d8b36c 0 17%, #9a6c35 18% 24%, transparent 25%),
    linear-gradient(135deg,#76502b,#c59a55 48%,#6b4728);
  color:#f9e8bf;
  font-size:27px;
  text-shadow:0 1px 2px #39220e;
  transition:opacity .9s ease;
}
#cover::after { content:"✦"; }
@media (max-width:420px) {
  .panel { padding:12px; }
  th,td { width:70px; }
}
</style>
</head>

<script>
const answers = [5.5, 3, 0, -14, 12];
const fieldIds = ["q1", "q2", "q3", "q4", "q5"];
let currentQuestion = 0;
let completed = false;

// HIER den Link zur nächsten Genially-Seite eintragen:
const NEXT_PAGE_URL = "HIER_DEN_LINK_ZUR_NAECHSTEN_GENIALLY_SEITE_EINFUEGEN";

const feedback = document.getElementById("feedback");
const checkButton = document.getElementById("checkButton");

function checkAnswer() {
  if (completed) return;

  const field = document.getElementById(fieldIds[currentQuestion]);
  const raw = field.value.trim().replace(",", ".");

  if (raw === "") {
    feedback.textContent = "Bitte gebt eine Antwort ein.";
    feedback.className = "error";
    field.focus();
    return;
  }

  const value = Number(raw);
  if (!Number.isFinite(value) || Math.abs(value - answers[currentQuestion]) > 0.000001) {
    feedback.textContent = "Da ist noch etwas falsch!";
    feedback.className = "error";
    field.focus();
    return;
  }

  field.value = String(answers[currentQuestion]).replace(".", ",");
  field.disabled = true;
  currentQuestion++;

  if (currentQuestion === answers.length) {
    completed = true;
    feedback.textContent = "Richtig! Das Siegel ist gebrochen.";
    feedback.className = "success";
    checkButton.style.display = "none";
   document.getElementById("resultCode").style.display = "flex";
  } else {
    feedback.textContent = "Richtig! Die nächste Lücke ist freigeschaltet.";
    feedback.className = "success";
    document.getElementById(fieldIds[currentQuestion]).disabled = false;
    document.getElementById(fieldIds[currentQuestion]).focus();
  }
}

checkButton.addEventListener("click", checkAnswer);

fieldIds.forEach(id => {
  document.getElementById(id).addEventListener("keydown", event => {
    if (event.key === "Enter") checkAnswer();
  });
});

</script>
